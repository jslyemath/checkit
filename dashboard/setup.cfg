[metadata]
name = checkit-dashboard
version = attr: checkit.VERSION
author = Steven Clontz
author_email = steven.clontz@gmail.com
description = Dashboard for authoring/disseminating randomized exercises
long_description = file: README.md
license = MIT License
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
python_requires = >=3.8.0
include_package_data = True
packages = find:
install_requires =
    ipywidgets
    lxml
    latex2mathml
    pystache
    click
    trogon
    sympy

[options.package_data]
checkit = static/*, wrapper/*

[options.extras_require]
dev =
    build
    twine
    ipykernel
# Only banks whose generators call plot() need this; tikz_graphics() needs no
# Python plotting library at all. Kept out of install_requires so the base
# install stays light, and plot() raises a clear message if it is missing.
plots =
    matplotlib
